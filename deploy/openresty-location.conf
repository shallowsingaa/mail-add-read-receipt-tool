# Paste INSIDE the existing site's server block in 1Panel.
# Replace its existing matching location, do not add a duplicate location /.
# Keep listen, server_name, and ssl_certificate settings managed by 1Panel.
location / {
    proxy_pass http://127.0.0.1:18000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # $remote_addr is the ESA peer until OpenResty's trusted real-IP rules are set.
    # Overwrite the client-supplied XFF rather than blindly appending it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
}

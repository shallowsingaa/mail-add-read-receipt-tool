services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    volumes:
      - ./server.toml:/config/server.toml:ro
      - receipt-data:/data
    networks:
      - receipt
    # Existing 1Panel/OpenResty (host networking) forwards to this loopback port.
    ports:
      - "127.0.0.1:${RECEIPT_PORT:-18000}:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    # Explicit opt-in only; existing 1Panel installations must not enable this.
    profiles: ["standalone"]
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/tls:ro
    networks:
      - receipt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  receipt-data:

networks:
  # Docker allocates a free subnet; do not pin one on an existing server.
  receipt: {}
